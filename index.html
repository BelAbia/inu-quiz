<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Which InuYasha Character Are You?</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="petals" aria-hidden="true">
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
    </div>

    <main class="quiz-container">

        <section class="welcome-screen">

            <div class="welcome-card">

                <h1>Which InuYasha Character Are You?</h1>

                <p>
                    Discover which character matches your personality.
                </p>

                <button id="start-button">
                    Start Your Journey
                </button>

            </div>

        </section>

        <section class="quiz-screen">

            <div class="quiz-card">

                <p class="question-number">Question 1 of 6</p>

                <h2 class="question-text">
                    You're traveling with a group and realize you've taken the wrong path. What do you do?
                </h2>

                <div class="answers">

                    <button class="answer-button">
                        Turn back immediately and find the right path.
                    </button>

                    <button class="answer-button">
                        Keep going. There might be something interesting ahead.
                    </button>

                    <button class="answer-button">
                        Stop and study the surroundings before deciding.
                    </button>

                    <button class="answer-button">
                        Ask the group what they think and decide together.
                    </button>

                    <button class="answer-button">
                        Pretend you meant to take this path and see where it leads.
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
