<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Which InuYasha Character Are You?</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="petals" aria-hidden="true">
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
        <span class="petal"></span>
    </div>

    <main class="quiz-container">

        <section class="welcome-screen">

            <div class="welcome-card">

                <h1>Which InuYasha Character Are You?</h1>

                <p>
                    Discover which character matches your personality.
                </p>

                <button id="start-button">
                    Start Your Journey
                </button>

            </div>

        </section>

        <section class="quiz-screen">

            <div class="quiz-card">

                <p class="question-number"></p>

                <h2 class="question-text"></h2>

                <div class="answers"></div>

            </div>

        </section>
        
        <section class="result-screen">
            <div class="result-card">
                <p class="result-label">Your journey has revealed...</p>

                <h2 class="result-name"></h2>

                <img class="result-image" src="" alt="">

                <p class="result-description"></p>

                <button class="restart-button">Try Again</button>
            </div>
        </section>


    </main>

    <script src="js/app.js"></script>

</body>

</html>
